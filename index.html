<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steps &amp; sleep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --day-bg: #F5EFE4;
    --night-bg: #232A44;
    --ink: #22262F;
    --ink-soft: #5C6270;
    --steps-color: #C97A2B;
    --steps-color-soft: rgba(201, 122, 43, 0.18);
    --sleep-color: #8D7BC7;
    --sleep-deep: #5B4B8A;
    --sleep-light: #B7A8E8;
    --line: rgba(34, 38, 47, 0.12);
    --card-bg: rgba(255, 255, 255, 0.55);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--day-bg) 0%, var(--day-bg) 46%, var(--night-bg) 46%, var(--night-bg) 100%);
    min-height: 100vh;
  }

  header {
    max-width: 920px;
    margin: 0 auto;
    padding: 56px 24px 32px;
  }

  h1 {
    font-family: 'Newsreader', serif;
    font-weight: 500;
    font-size: clamp(32px, 5vw, 48px);
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--ink-soft);
    font-size: 16px;
    margin: 0;
    max-width: 60ch;
  }

  .range-picker {
    display: flex;
    gap: 8px;
    margin: 28px auto 0;
    max-width: 920px;
    padding: 0 24px;
  }

  .range-picker button {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.6);
    color: var(--ink);
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .range-picker button:hover { background: rgba(255,255,255,0.9); }
  .range-picker button.active {
    background: var(--ink);
    color: white;
    border-color: var(--ink);
  }

  main {
    max-width: 920px;
    margin: 0 auto;
    padding: 24px 24px 80px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
  }

  .stat {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 20px;
    backdrop-filter: blur(6px);
  }

  .stat .value {
    font-family: 'Newsreader', serif;
    font-size: 30px;
    font-weight: 500;
    line-height: 1.1;
  }

  .stat .label {
    color: var(--ink-soft);
    font-size: 13px;
    margin-top: 4px;
  }

  .panel {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 24px;
    backdrop-filter: blur(6px);
  }

  .panel h2 {
    font-family: 'Newsreader', serif;
    font-weight: 500;
    font-size: 22px;
    margin: 0 0 4px;
  }

  .panel p.hint {
    color: var(--ink-soft);
    font-size: 13px;
    margin: 0 0 18px;
  }

  .panel.night {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.14);
    color: #EDEBF6;
  }

  .panel.night p.hint { color: #B7BAD1; }

  canvas { max-height: 320px; }

  .empty-state {
    text-align: center;
    padding: 60px 24px;
    color: var(--ink-soft);
  }

  .empty-state code {
    background: rgba(0,0,0,0.06);
    padding: 2px 6px;
    border-radius: 4px;
  }

  footer {
    max-width: 920px;
    margin: 0 auto;
    padding: 0 24px 60px;
    color: #B7BAD1;
    font-size: 13px;
  }

  canvas { cursor: pointer; }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(20, 20, 25, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }

  .modal-backdrop.open { display: flex; }

  .modal {
    background: #FBF8F1;
    color: var(--ink);
    border-radius: 18px;
    max-width: 480px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 28px;
    position: relative;
  }

  .modal h3 {
    font-family: 'Newsreader', serif;
    font-weight: 500;
    font-size: 26px;
    margin: 0 0 18px;
  }

  .modal .close-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--ink-soft);
    line-height: 1;
  }

  .modal .metric-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }

  .modal .metric-row:last-child { border-bottom: none; }

  .modal .metric-label { color: var(--ink-soft); font-size: 14px; }
  .modal .metric-value { font-weight: 600; font-size: 15px; }

  .modal .section-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    margin: 20px 0 4px;
  }

  .modal .empty-metric { color: var(--ink-soft); font-size: 13px; font-style: italic; }
</style>
</head>
<body>

<header>
  <h1>Steps &amp; sleep</h1>
  <p class="subtitle">A running record of daily activity and sleep, pulled automatically each morning.</p>
  <p class="subtitle" style="margin-top: 6px;"><a href="/upload.html" style="color: inherit;">Import data manually &rarr;</a></p>
</header>

<div class="range-picker" id="rangePicker">
  <button data-days="7">7 days</button>
  <button data-days="30" class="active">30 days</button>
  <button data-days="90">90 days</button>
  <button data-days="0">All time</button>
</div>

<main id="main">
  <div class="stats-row" id="statsRow"></div>
  <div class="panel">
    <h2>Steps</h2>
    <p class="hint">Daily step count &middot; click a bar for detail</p>
    <canvas id="stepsChart"></canvas>
  </div>
  <div class="panel night">
    <h2>Sleep</h2>
    <p class="hint">Deep and light sleep, hours per night &middot; click a bar for detail</p>
    <canvas id="sleepChart"></canvas>
  </div>
</main>

<footer>Data pulled directly from Mi Fitness. Updated daily.</footer>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <button class="close-btn" id="modalClose">&times;</button>
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
  </div>
</div>

<script>
let allData = [];
let stepsChart, sleepChart;

function fmtDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function average(arr) {
  const vals = arr.filter(v => v !== null && v !== undefined && !isNaN(v));
  if (!vals.length) return 0;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}

function minutesToHrsMin(min) {
  if (!min) return '0m';
  const h = Math.floor(min / 60);
  const m = Math.round(min % 60);
  return h ? `${h}h ${m}m` : `${m}m`;
}

function fmtTime(unixSeconds) {
  if (!unixSeconds) return null;
  return new Date(unixSeconds * 1000).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

function row(label, value) {
  if (value === null || value === undefined || value === '') return '';
  return `<div class="metric-row"><span class="metric-label">${label}</span><span class="metric-value">${value}</span></div>`;
}

function showDayDetail(day) {
  const raw = day.raw || {};
  const hr = raw.heart_rate;
  const intensity = raw.intensity;
  const stand = raw.valid_stand;
  const stress = raw.stress;
  const spo2 = raw.spo2;

  document.getElementById('modalTitle').textContent = new Date(day.date + 'T00:00:00')
    .toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });

  let html = '';

  html += '<div class="section-title">Activity</div>';
  html += row('Steps', (day.steps || 0).toLocaleString());
  html += row('Distance', day.distance_m ? `${(day.distance_m / 1000).toFixed(2)} km` : null);
  html += row('Calories', day.calories || null);
  html += row('Standing hours', stand ? stand.count : null);
  html += row('Intensity minutes', intensity ? intensity.duration : null);

  html += '<div class="section-title">Sleep</div>';
  if (day.sleep_total_min) {
    html += row('Total sleep', minutesToHrsMin(day.sleep_total_min));
    html += row('Deep sleep', minutesToHrsMin(day.sleep_deep_min));
    html += row('Light sleep', minutesToHrsMin(day.sleep_light_min));
    if (raw.sleep) {
      html += row('Sleep score', raw.sleep.sleep_score);
      html += row('Avg. heart rate (sleep)', raw.sleep.avg_hr ? `${raw.sleep.avg_hr} bpm` : null);
    }
  } else {
    html += '<div class="empty-metric">No sleep data for this day</div>';
  }

  html += '<div class="section-title">Heart rate</div>';
  if (hr) {
    html += row('Average', hr.avg_hr ? `${hr.avg_hr} bpm` : null);
    html += row('Resting', hr.avg_rhr ? `${hr.avg_rhr} bpm` : null);
    html += row('Range', hr.min_hr && hr.max_hr ? `${hr.min_hr}–${hr.max_hr} bpm` : null);
  } else {
    html += '<div class="empty-metric">No heart rate data for this day</div>';
  }

  if (stress || spo2) {
    html += '<div class="section-title">Other</div>';
    if (stress) html += row('Avg. stress', stress.avg_stress);
    if (spo2) html += row('Avg. blood oxygen', spo2.avg_spo2 ? `${spo2.avg_spo2}%` : null);
  }

  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalBackdrop').classList.add('open');
}

function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('open');
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalBackdrop').addEventListener('click', (e) => {
  if (e.target.id === 'modalBackdrop') closeModal();
});

let currentFiltered = [];

function render(days) {
  const filtered = days === 0 ? allData : allData.slice(-days);
  currentFiltered = filtered;
  const labels = filtered.map(d => fmtDate(d.date));

  const steps = filtered.map(d => d.steps || 0);
  const deepHrs = filtered.map(d => (d.sleep_deep_min || 0) / 60);
  const lightHrs = filtered.map(d => (d.sleep_light_min || 0) / 60);
  const totalSleepHrs = filtered.map(d => (d.sleep_total_min || 0) / 60);

  const avgSteps = Math.round(average(steps));
  const avgSleep = average(totalSleepHrs);
  const bestSteps = Math.max(0, ...steps);

  document.getElementById('statsRow').innerHTML = `
    <div class="stat">
      <div class="value">${avgSteps.toLocaleString()}</div>
      <div class="label">Avg. daily steps</div>
    </div>
    <div class="stat">
      <div class="value">${avgSleep.toFixed(1)}h</div>
      <div class="label">Avg. sleep / night</div>
    </div>
    <div class="stat">
      <div class="value">${bestSteps.toLocaleString()}</div>
      <div class="label">Best day (steps)</div>
    </div>
    <div class="stat">
      <div class="value">${filtered.length}</div>
      <div class="label">Days shown</div>
    </div>
  `;

  if (stepsChart) stepsChart.destroy();
  if (sleepChart) sleepChart.destroy();

  const stepsCtx = document.getElementById('stepsChart').getContext('2d');
  stepsChart = new Chart(stepsCtx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Steps',
        data: steps,
        backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--steps-color-soft'),
        borderColor: getComputedStyle(document.documentElement).getPropertyValue('--steps-color'),
        borderWidth: 1.5,
        borderRadius: 4,
        maxBarThickness: 28
      }]
    },
    options: {
      responsive: true,
      onClick: (evt, elements) => {
        if (elements.length) showDayDetail(currentFiltered[elements[0].index]);
      },
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false } },
        y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.06)' } }
      }
    }
  });

  const sleepCtx = document.getElementById('sleepChart').getContext('2d');
  sleepChart = new Chart(sleepCtx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          label: 'Deep sleep',
          data: deepHrs,
          backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--sleep-deep'),
          stack: 'sleep',
          borderRadius: 4,
          maxBarThickness: 24
        },
        {
          label: 'Light sleep',
          data: lightHrs,
          backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--sleep-light'),
          stack: 'sleep',
          borderRadius: 4,
          maxBarThickness: 24
        }
      ]
    },
    options: {
      responsive: true,
      onClick: (evt, elements) => {
        if (elements.length) showDayDetail(currentFiltered[elements[0].index]);
      },
      plugins: {
        legend: {
          position: 'top',
          align: 'end',
          labels: { color: '#EDEBF6', boxWidth: 12, font: { size: 12 } }
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: '#B7BAD1' } },
        y: {
          beginAtZero: true,
          stacked: true,
          title: { display: true, text: 'Hours', color: '#B7BAD1' },
          grid: { color: 'rgba(255,255,255,0.08)' },
          ticks: { color: '#B7BAD1' }
        }
      }
    }
  });
}

async function init() {
  try {
    const res = await fetch('/api/data', { cache: 'no-store' });
    if (!res.ok) throw new Error('no data yet');
    allData = await res.json();
  } catch (e) {
    document.getElementById('main').innerHTML = `
      <div class="empty-state">
        <p>No data yet. Once the daily pull has run at least once, this page will fill in automatically.</p>
        <p>Data is served from <code>/api/data</code> once the scheduled pull has run.</p>
      </div>
    `;
    return;
  }

  if (!allData.length) {
    document.getElementById('main').innerHTML = `<div class="empty-state"><p>No data yet.</p></div>`;
    return;
  }

  render(30);

  document.querySelectorAll('#rangePicker button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#rangePicker button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render(parseInt(btn.dataset.days, 10));
    });
  });
}

init();
</script>

</body>
</html>
